<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>VR-Test Haupteingang</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
    #ui{position:fixed;z-index:10;top:16px;left:16px;background:rgba(15,20,28,.92);color:#fff;padding:14px;border-radius:12px;max-width:320px}
    #ui h1{font-size:18px;margin:0 0 8px}
    #ui p{margin:6px 0 10px;font-size:14px}
    #enter{background:#22c55e;color:#06150b;border:0;border-radius:9px;padding:10px 14px;font-weight:700;font-size:16px;cursor:pointer}
    #status{font-size:13px;opacity:.85}
    body.in-vr #ui{display:none}
    a-scene{position:fixed!important;inset:0!important;width:100%!important;height:100%!important}
  </style>
</head>
<body>
  <div id="ui">
    <h1>VR-Test – Haupteingang</h1>
    <p id="status">WebXR wird geprüft …</p>
    <button id="enter" type="button">VR starten</button>
    <p>Testziel: Nach dem Start soll das Panorama das ganze Sichtfeld füllen und sich mit deiner Kopfbewegung mitdrehen.</p>
  </div>

  <a-scene id="scene" embedded xr-mode-ui="enabled:false" webxr="referenceSpaceType: local-floor" renderer="colorManagement:true; antialias:true">
    <a-assets>
      <img id="pano" src="haupteingang.jpg" crossorigin="anonymous">
    </a-assets>
    <a-sky src="#pano" rotation="0 -90 0"></a-sky>
    <a-entity id="rig">
      <a-camera wasd-controls-enabled="false"></a-camera>
      <a-entity laser-controls="hand:right"></a-entity>
      <a-entity laser-controls="hand:left"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.getElementById('scene');
    const status = document.getElementById('status');
    const enter = document.getElementById('enter');

    async function checkXR(){
      if(!navigator.xr){
        status.textContent='Dieser Browser stellt WebXR nicht bereit.';
        enter.disabled=true;
        return;
      }
      try{
        const ok=await navigator.xr.isSessionSupported('immersive-vr');
        status.textContent=ok ? 'Immersive VR wird unterstützt.' : 'Immersive VR wird nicht unterstützt.';
        enter.disabled=!ok;
      }catch(e){
        status.textContent='WebXR-Prüfung fehlgeschlagen: '+e.message;
      }
    }

    enter.addEventListener('click', async ()=>{
      try{
        await scene.enterVR();
      }catch(e){
        status.textContent='VR-Start fehlgeschlagen: '+e.message;
      }
    });
    scene.addEventListener('enter-vr',()=>document.body.classList.add('in-vr'));
    scene.addEventListener('exit-vr',()=>document.body.classList.remove('in-vr'));
    scene.addEventListener('loaded',checkXR);
  </script>
</body>
</html>
